services:
  app:
    image: thonifasya/cucikilat-app:${IMAGE_TAG:-latest}
    container_name: cucikilat_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8081}:80"
    environment:
      APP_NAME: CuciKilat
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?APP_KEY wajib diisi di file .env}
      APP_URL: ${APP_URL:-http://localhost:8081}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-cucikilat}
      DB_USERNAME: ${DB_USERNAME:-cucikilat}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di file .env}
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/health') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  db:
    image: mysql:8.0
    container_name: cucikilat_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-cucikilat}
      MYSQL_USER: ${DB_USERNAME:-cucikilat}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi di file .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD wajib diisi di file .env}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  db_data:

networks:
  frontend:
  backend:
    internal: true
